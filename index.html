<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="conteudo">
    <div class="conteudo-titulo">
        <img src="cadeado.png" alt="cadeado fechado">
        <h1 class="titulo-pincipal">Gerador de Senhas</h1>
        <h2 class="titulo-secundario">Gere uma senha aleatoria e segura</h2>
    </div>
    <div class="conteudo-senha">
        <label for="senha">Senha</label>
        <input name="senha" type="text" id="campo-senha">
    </div>
    <div class="parametro"> 
        <h3 class="parametro-titulo">Peronalize sua senha</h3>
        <div class="parametro-coluna__senha">
            <div class="parametro-senha">
            <h4 class="parametro-senha__titulo">Número de caracteres</h4>
            <div class="paremetro-senha-botoes">
        <button class="parametro-senha__botao">-</button>
        <p class="paremetro-senha__texto">12</p>
        <button class="parametro_senha__botao">+</button>
            </div>
            </div>
            <div class="parametro-senha">
                <h4 class="parametro-senha__titulo">Características da Senha</h4>
            </div>
        </div>
    </div>
    </section>
</body>
</html>
