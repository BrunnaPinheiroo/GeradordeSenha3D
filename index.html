<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de senha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="conteudo">

        <section class="conteudo-titulo">

            <img
                class="cadeado-conteudo"
                src="cadeado.png"
                alt="Cadeado fechado"
            >

            <h1 class="titulo-principal">
                Gerador de senhas
            </h1>

            <h2 class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura
            </h2>

        </section>


        <section class="conteudo-senha">

            <label for="campo-senha">
                Senha
            </label>

            <input
                name="senha"
                type="text"
                id="campo-senha"
                readonly
            >

        </section>


        <section class="parametro">

            <h3 class="parametro-titulo">
                Personalize sua senha
            </h3>


            <div class="parametro-coluna__senha">

                <!-- TAMANHO -->

                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Número de caracteres
                    </h4>

                    <div class="parametro-senha__botoes">

                        <button
                            type="button"
                            class="parametro-senha__botao"
                            id="diminuir"
                        >
                            -
                        </button>

                        <p class="parametro-senha__texto">
                            12
                        </p>

                        <button
                            type="button"
                            class="parametro-senha__botao"
                            id="aumentar"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- CARACTERÍSTICAS -->

                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Características da senha
                    </h4>


                    <div class="parametro-senha__checkbox">

                        <input
                            id="maiusculo"
                            name="maiusculo"
                            type="checkbox"
                            class="checkbox"
                            checked
                        >

                        <label for="maiusculo">
                            Letras maiúsculas
                        </label>

                    </div>


                    <div class="parametro-senha__checkbox">

                        <input
                            id="minusculo"
                            name="minusculo"
                            type="checkbox"
                            class="checkbox"
                            checked
                        >

                        <label for="minusculo">
                            Letras minúsculas
                        </label>

                    </div>


                    <div class="parametro-senha__checkbox">

                        <input
                            id="numero"
                            name="numero"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="numero">
                            Números
                        </label>

                    </div>


                    <div class="parametro-senha__checkbox">

                        <input
                            id="simbolo"
                            name="simbolo"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="simbolo">
                            Símbolos
                        </label>

                    </div>

                </div>


                <!-- FORÇA -->

                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Força da senha
                    </h4>

                    <div class="barra"></div>

                    <div class="forca fraca"></div>

                    <div class="parametro-senha-textos">

                        <p>Fraca</p>
                        <p>Média</p>
                        <p>Forte</p>

                    </div>

                    <p class="entropia"></p>

                </div>

            </div>

        </section>

    </main>


    <script src="main.js"></script>

</body>

</html>
